services:
  sudoku-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: sudoku-game:1.0.0
    container_name: sudoku-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      TZ: Asia/Bangkok
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    # nginx ไม่ต้องเขียนไฟล์ใน image → ล็อก root filesystem
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

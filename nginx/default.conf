server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # ---------- security headers ----------
    # (ไม่ใส่ add_header ใน location ลูก เพื่อไม่ให้ header ชุดนี้หลุด inheritance)
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self' https://*.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; font-src 'self' data:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;

    # ---------- compression ----------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml;

    # ---------- health ----------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---------- assets ที่มี hash ในชื่อ: cache ได้ยาว ----------
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # ---------- html / icon: ต้อง revalidate ทุกครั้ง ----------
    location = /index.html {
        expires -1;
    }

    location = /favicon.svg {
        expires 7d;
        access_log off;
    }

    # ---------- SPA fallback ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ซ่อนไฟล์ที่ dot ขึ้นต้น
    location ~ /\. {
        deny all;
    }
}
